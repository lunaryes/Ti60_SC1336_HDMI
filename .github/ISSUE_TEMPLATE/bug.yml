name: 缺陷报告
description: 仿真失败、画面异常、综合报错、时序不收敛
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: stage
    attributes:
      label: 出现阶段
      options:
        - L1 模块仿真
        - L2 算法比对
        - L3 集成综合
        - L3 上板
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 客观描述看到什么（波形、截图、报错原文）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、输入激励、分支与 commit
      placeholder: |
        分支/commit：
        L1 复现：sh sim/run.sh
        L2 复现：sh sim/l2_verify.sh
        激励：TB 内建图案（见 sim/tb_*.v 顶部注释），或自定义输入
        报告：sim/l2_report.txt
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: 相关文件
      placeholder: src/image/sobel_edge.v
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的排查
      description: 排除过哪些可能，避免重复劳动
    validations:
      required: false
